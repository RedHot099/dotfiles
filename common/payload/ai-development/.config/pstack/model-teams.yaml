version: 1

dispatch:
  native_provider:
    codex: openai
    claude-code: anthropic
    cursor: parent-model-provider
    grok-build: xai
  panel:
    unavailable_provider: report-and-skip
    substitute_provider: false

teams:
  explore:
    openai: { model: gpt-5.6-luna, effort: medium }
    anthropic: { model: claude-sonnet-5, effort: medium }
    xai: { model: grok-4.6, effort: low }
  build:
    openai: { model: gpt-5.6-terra, effort: high }
    anthropic: { model: claude-opus-5, effort: high }
    xai: { model: grok-4.6, effort: medium }
  deep:
    openai: { model: gpt-5.6-sol, effort: high }
    anthropic: { model: claude-opus-5, effort: high }
    xai: { model: grok-4.6, effort: high }
  judge:
    openai: { model: gpt-5.6-sol, effort: max }
    anthropic: { model: claude-fable-5, effort: high, thinking: adaptive }
    xai: { model: grok-4.6, effort: xhigh }
