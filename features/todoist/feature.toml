id = "todoist"
label = "Todoist tasks widget"
description = "Todoist CLI helper and Omarchy Shell tasks plugin"
default = false
visible = false
group = "Desktop"
commands = ["td"]
requires = ["tool.node"]
mise = ["npm:@doist/todoist-cli@latest"]

[[files]]
source = "payload/todoist"
target = "."

[[auth]]
label = "Todoist"
command = "td auth login"
probe = "td auth status"
