id = "cloud.google-drive"
label = "Google Drive"
description = "Google Drive mount through rclone"
default = false
visible = true
group = "Cloud"
requires = ["tool.rclone"]
reload_systemd = true
units = ["rclone-google-drive.service"]

[[files]]
source = "payload/cloud-google-drive"
target = "."

[[auth]]
label = "Google Drive remote"
command = "rclone config"
probe = "rclone listremotes"
probe_contains = "gdrive:"
