version: 2

# Third member: GLM through Cursor. When Cursor has no usage left for
# external models, use the `fallback` member (latest Grok, xhigh, fast).
# GLM and Grok slugs are unverified until Cursor is signed in to T3 Code;
# resolve them with `orchestrator_capabilities` before dispatch.

dispatch:
  native_provider:
    codex: openai
    claude-code: anthropic
    cursor: parent-model-provider
    grok-build: xai
  panel:
    order: [openai, anthropic, zai]
    unavailable_provider: report-and-skip
    substitute_provider: false

teams:
  explore:
    openai: { model: gpt-6.1-sol, effort: medium }
    anthropic: { model: claude-sonnet-5-5, effort: medium }
    zai: { model: glm-5.3, effort: medium, host: cursor, fallback: { provider: xai, model: grok-4.7, effort: low, fast: true } }
  build:
    openai: { model: gpt-6.1-sol, effort: high }
    anthropic: { model: claude-opus-5-5, effort: high }
    zai: { model: glm-5.3, effort: high, host: cursor, fallback: { provider: xai, model: grok-4.7, effort: medium, fast: true } }
  deep:
    openai: { model: gpt-6.1-sol, effort: high }
    anthropic: { model: claude-opus-5-5, effort: high }
    zai: { model: glm-5.3, effort: max, host: cursor, fallback: { provider: xai, model: grok-4.7, effort: xhigh, fast: true } }
  judge:
    openai: { model: gpt-6.1-sol, effort: xhigh }
    anthropic: { model: claude-opus-5-5, effort: high }
    zai: { model: glm-5.3, effort: max, host: cursor, fallback: { provider: xai, model: grok-4.7, effort: xhigh, fast: true } }
