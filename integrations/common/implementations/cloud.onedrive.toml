schema = 2
id = "cloud.onedrive"
reload_user_daemon = true
user_units = ["rclone-onedrive.service"]

[[files]]
source = "payload/cloud-onedrive"
target = "."

[[authentication]]
label = "OneDrive (create an rclone remote named onedrive)"
command = ["rclone", "config"]
probe = ["rclone", "listremotes"]
probe_contains = "onedrive:"
